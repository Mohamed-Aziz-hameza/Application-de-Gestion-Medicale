spring.application.name=federebackend
server.port=7070

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/app_medicale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=CHANGE_ME_DB_USERNAME
spring.datasource.password=CHANGE_ME_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===== MongoDB =====
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=APPMED

# ===== JWT =====
app.jwt.secret=CHANGE_ME_BASE64_JWT_SECRET
app.jwt.expiration-ms=86400000

# ===== OTP =====
app.otp.expiration-minutes=10

# ===== Frontend =====
app.frontend.url=http://localhost:5173

# ===== Mail =====
spring.mail.host=smtp.ethereal.email
spring.mail.port=587
spring.mail.username=CHANGE_ME_MAIL_USERNAME
spring.mail.password=CHANGE_ME_MAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.from=CHANGE_ME_MAIL_FROM

# ===== Gemini AI =====
# Fill this block from your Google Gemini key details: API Key, Name, Project name, Project number.
app.gemini.api-key=CHANGE_ME_GEMINI_API_KEY
app.gemini.api-key-name=CHANGE_ME_GEMINI_KEY_NAME
app.gemini.project-name=projet federe isil2
app.gemini.project-number=CHANGE_ME_GCP_PROJECT_NUMBER
app.gemini.model=gemini-2.5-flash
app.gemini.enabled=true
app.gemini.endpoint-base=https://generativelanguage.googleapis.com/v1beta/models
